<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="../icons/favicon.png" type="image/x-icon">
    <title>Login - Calendallica</title>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body
    class="bg-zinc-950 text-zinc-50 antialiased min-h-screen flex flex-col items-center justify-center p-5 md:p-10 relative">

    <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-200 h-[700px] bg-indigo-600/10 blur-[130px] rounded-full -z-10">
    </div>

    <a href="/"><img class="max-w-90" src="../icons/logo.png" alt="Calendallica"></a>

    <!-- Container -->
    <div
        class="max-w-120 container flex flex-col p-8 justify-center items-center bg-zinc-900/40 border border-zinc-800/50 rounded-2xl">

        <form class="grid w-full md:container grid-rows-2 gap-5 pb-10 border-b border-zinc-800/50" id="loginForm">

            <div class="flex flex-col">
                <label class="font-semibold text-sm py-2 text-zinc-500" for="username">TYPE USERNAME</label>

                <input name="username" class="bg-zinc-950/50 border border-zinc-800 rounded-xl py-3 px-5 md:py-5 :px-7"
                    type="text" id="login-username" placeholder="Username" minlength="4" maxlength="12" required>
            </div>

            <div class="flex flex-col">
                <label class="font-semibold text-sm py-2 text-zinc-500" for="password">TYPE PASSWORD</label>

                <input name="password" class="bg-zinc-950/50 border border-zinc-800 rounded-xl py-3 px-5 md:py-5 :px-7"
                    type="password" id="login-password" placeholder="Password" minlength="8" maxlength="35" required>
            </div>

            <input id="submit-button"
                class="flex justify-center items-center rounded-xl cursor-pointer text-zinc-50 font-semibold bg-indigo-600 hover:bg-indigo-700 disabled:bg-zinc-800 disabled:text-zinc-500 disabled:cursor-not-allowed disabled:shadow-none shadow-md md:shadow-2xl shadow-indigo-500/25 py-5 mt-5 border border-zinc-800 transition-all"
                type="submit" value="Connect to account">

        </form>

        <div class="mt-5 flex flex-col justify-center items-center gap-3 max-sm:text-sm">
            <p class="text-zinc-400">Don't have an account yet? <a href="/signup"
                    class="text-indigo-400 hover:text-indigo-300 font-semibold transition-colors">Sign up here</a>
            </p>
            <a href="/" class="hover:text-zinc-300 text-zinc-400 transition-colors">Return</a>

        </div>

    </div>

    <script type="module" src="../js/login.js"></script>
</body>

</html>
