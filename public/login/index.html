<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    
    <form id="loginForm">
        <label for="username">Username</label>
        <input type="text" name="username" id="login-username" required maxlength="12">

        <label for="password">Password</label>
        <input type="password" name="password" id="login-password" required maxlength="35">

        <input type="submit">
    </form>

    <script src="../js/login.js"></script>

</body>
</html>
